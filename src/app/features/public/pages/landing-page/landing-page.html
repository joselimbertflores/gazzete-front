<landing-hero (search)="search($event)" />

@if (landingResource.error()) {
  <app-landing-error-state />
} @else if (landingResource.isLoading()) {
  <app-landing-sections-skeleton />
} @else if (landingResource.hasValue()) {
  @let landing = landingResource.value();

  @if (landing.featuredDocuments.length > 0) {
    <app-featured-documents-section [documents]="landing.featuredDocuments" />
  }

  @if (landing.documentTypes.length > 0) {
    <app-document-types-section [documentTypes]="landing.documentTypes" />
  }

  @if (landing.recentDocuments.length > 0) {
    <app-recent-documents-section [documents]="landing.recentDocuments" />
  }

  <app-landing-stats-section [stats]="landing.stats" />
}
