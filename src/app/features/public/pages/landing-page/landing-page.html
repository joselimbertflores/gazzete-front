<section class="border-b border-slate-200 bg-white">
  <div class="mx-auto max-w-7xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8 lg:py-20">
    <div class="mx-auto max-w-3xl text-center">
      <h1 class="text-3xl font-semibold tracking-tight text-slate-950 sm:text-4xl lg:text-5xl">
        Consulte la Gaceta Municipal
      </h1>

      <p class="mt-4 text-base leading-7 text-slate-600 sm:text-lg">
        Busque ordenanzas, decretos, resoluciones y otras publicaciones oficiales del municipio.
      </p>
    </div>

    <div class="mx-auto mt-8 max-w-2xl">
      <form class="flex flex-col gap-3 sm:flex-row" (submit)="onSearch($event)">
        <label for="public-search" class="sr-only">
          Buscar documentos en la Gaceta Municipal
        </label>

        <input
          id="public-search"
          pInputText
          type="search"
          autocomplete="off"
          class="w-full rounded-xl border-slate-300 px-4 py-3 text-base shadow-none"
          placeholder="Buscar por número, título o palabra clave"
          [value]="searchTerm()"
          (input)="updateSearch($event)"
        />

        <button
          pButton
          type="submit"
          label="Buscar"
          icon="pi pi-search"
          class="sm:shrink-0"
        ></button>
      </form>

      <p class="mt-3 text-center text-sm text-slate-500">
        Busque por número de documento, título o tema.
      </p>
    </div>
  </div>
</section>
