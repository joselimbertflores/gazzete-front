<app-landing-hero
  [searchTerm]="searchTerm()"
  (searchTermChange)="searchTerm.set($event)"
  (search)="search()"
/>

@if (landingResource.error()) {
  <app-landing-error-state />
} @else if (landingResource.isLoading()) {
  <app-landing-sections-skeleton />
} @else if (landingResource.hasValue()) {
  @if (documentTypes().length > 0) {
    <app-document-types-section [documentTypes]="documentTypes()" />
  }

  @if (featuredDocuments().length > 0) {
    <app-featured-documents-section [documents]="featuredDocuments()" />
  }

  @if (recentDocuments().length > 0) {
    <app-recent-documents-section [documents]="recentDocuments()" />
  }

  @if (statistics(); as stats) {
    <app-landing-stats-section [statistics]="stats" />
  }
}
