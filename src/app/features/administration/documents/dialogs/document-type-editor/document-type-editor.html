<form [formGroup]="form" (ngSubmit)="save()">
  <div class="flex flex-col gap-y-6 pt-1">
    <div class="flex flex-col gap-1">
      <p-floatlabel variant="on">
        <label>Nombre *</label>
        <input
          pInputText
          class="w-full"
          formControlName="name"
          [invalid]="formUtils.isInvalid(form.get('name'))"
        />
      </p-floatlabel>
      @if (formUtils.isInvalid(form.get('name'))) {
        <p-message severity="error" size="small" variant="simple">
          {{ formUtils.getErrorMessage(form.get('name')) }}
        </p-message>
      }
    </div>
    <div class="flex flex-col gap-1">
      <p-floatlabel variant="on">
        <label>Descripción</label>
        <input pInputText class="w-full" formControlName="description" />
      </p-floatlabel>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <p-floatlabel variant="on">
          <p-select
            inputId="numberMode"
            [options]="numberingModes"
            formControlName="numberingMode"
            appendTo="body"
            [fluid]="true"
          >
          </p-select>
          <label for="numberMode">Modo de numeracion</label>
        </p-floatlabel>
      </div>
      <div class="flex items-center px-2">
        <p-checkbox name="pizza" [binary]="true" formControlName="isActive" />
        <label class="ml-2"> Habilitado </label>
      </div>
    </div>
  </div>

  <div class="p-dialog-footer">
    <p-button type="button" label="Cancelar" severity="secondary" (onClick)="close()" />
    <p-button type="submit" label="Guardar" />
  </div>
</form>
