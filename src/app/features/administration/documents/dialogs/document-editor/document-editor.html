<form [formGroup]="form" (ngSubmit)="save()">
  <p-stepper [value]="1">
    <p-step-list>
      <p-step [value]="1">Datos del documento</p-step>
      <p-step [value]="2">Adjuntar archivo</p-step>
      <p-step [value]="3">Relaciones jurídicas</p-step>
    </p-step-list>
    <p-step-panels>
      <p-step-panel [value]="1">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-y-6 gap-x-4 pt-1">
            <div class="sm:col-span-3">
              <p-floatlabel class="w-full" variant="on">
                <p-select
                  [options]="types()"
                  [filter]="true"
                  emptyFilterMessage="Sin resultados"
                  inputId="typeTxt"
                  optionLabel="name"
                  optionValue="id"
                  [fluid]="true"
                  formControlName="typeId"
                  appendTo="body"
                />
                <label for="typeTxt">Tipo de documento</label>
              </p-floatlabel>
            </div>
            <div class="sm:col-span-3">
              <p-floatlabel variant="on">
                <input pInputText id="titleTxt" [fluid]="true" formControlName="title" />
                <label for="titleTxt">Titulo</label>
              </p-floatlabel>
            </div>
            <div class="sm:col-span-3">
              <p-floatlabel variant="on">
                <textarea
                  pTextarea
                  id="summaryTxt"
                  rows="2"
                  [fluid]="true"
                  formControlName="summary"
                ></textarea>
                <label for="summaryTxt">Resumen</label>
              </p-floatlabel>
            </div>

            <p-floatlabel variant="on">
              <p-inputnumber
                formControlName="correlativeNumber"
                inputId="numberTxt"
                mode="decimal"
                [useGrouping]="false"
                [fluid]="true"
              />
              <label for="numberTxt">Numero</label>
            </p-floatlabel>

            <!-- <p-floatlabel variant="on">
              <p-datepicker
                inputId="yearInput"
                view="year"
                dateFormat="yy"
                showIcon
                iconDisplay="input"
                appendTo="body"
                [fluid]="true"
                formControlName="year"
              />
              <label for="yearInput">Gestión</label>
            </p-floatlabel> -->

            <p-floatlabel variant="on">
              <p-datepicker
                inputId="publicationTxt"
                showIcon
                iconDisplay="input"
                appendTo="body"
                [fluid]="true"
                formControlName="publicationDate"
              />
              <label for="publicationTxt">Fecha publicacion</label>
            </p-floatlabel>

            <p-floatlabel variant="on">
              <p-datepicker
                inputId="promulgationTxt"
                showIcon
                iconDisplay="input"
                appendTo="body"
                [fluid]="true"
                formControlName="promulgationDate"
              />
              <label for="promulgationTxt">Fecha promulgacion</label>
            </p-floatlabel>

            <p-floatlabel variant="on">
              <p-datepicker
                inputId="validUntilTxt"
                showIcon
                iconDisplay="input"
                appendTo="body"
                [fluid]="true"
                formControlName="validUntil"
              />
              <label for="validUntilTxt">Plazo de vigencia</label>
            </p-floatlabel>
          </div>

          <div class="flex pt-6 justify-end">
            <p-button
              label="Siguiente"
              icon="pi pi-arrow-right"
              iconPos="right"
              (onClick)="activateCallback(2)"
              [outlined]="true"
              size="small"
            />
          </div>
        </ng-template>
      </p-step-panel>
      <p-step-panel [value]="2">
        <ng-template #content let-activateCallback="activateCallback">
          <p-fileUpload
            [auto]="false"
            [multiple]="false"
            [showCancelButton]="false"
            [showUploadButton]="false"
            accept="application/pdf"
            chooseLabel="Seleccionar"
            (onSelect)="selectFile($event)"
          >
            <ng-template #content let-files>
              @if (files?.length > 0) {
                @let file = files[0];
                <div class="flex items-center gap-x-4 mt-5 p-2">
                  <i class="pi pi-file-pdf text-red-500" style="font-size: 1.5rem"></i>
                  <div class="flex flex-col min-w-0">
                    <span class="text-sm font-medium truncate">
                      {{ file.name }}
                    </span>
                    <span class="text-xs text-surface-500">
                      {{ file.size | fileSize }}
                    </span>
                  </div>
                </div>
              } @else {
                <div class="text-center mt-5 p-2">
                  <span class="text-sm text-surface-500 font-medium">
                    <i class="pi pi-upload mr-2"></i>
                    Seleccione o arrastre el documento PDF aquí
                  </span>
                </div>
              }
            </ng-template>
          </p-fileUpload>

          <div class="flex pt-6 justify-between">
            <p-button
              label="Atras"
              severity="secondary"
              icon="pi pi-arrow-left"
              (onClick)="activateCallback(1)"
              [outlined]="true"
              size="small"
            />
            <p-button
              label="Siguiente"
              icon="pi pi-arrow-right"
              iconPos="right"
              [outlined]="true"
              size="small"
              (onClick)="activateCallback(3)"
            />
          </div>
        </ng-template>
        <p-step-panel [value]="3">
          <ng-template #content let-activateCallback="activateCallback"> </ng-template>
        </p-step-panel>
      </p-step-panel>
      <p-step-panel [value]="3">
        <ng-template g-template #content let-activateCallback="activateCallback">
          <div class="space-y-4">
            <!-- Botón agregar -->
            <button
              pButton
              type="button"
              label="Agregar relación"
              icon="pi pi-plus"
              (click)="addRelation()"
              class="p-button-sm"
            ></button>

            <!-- Lista de relaciones -->
            <div formArrayName="relations" class="space-y-3">
              <div
                *ngFor="let rel of relations.controls; let i = index"
                [formGroupName]="i"
                class="p-3 border rounded-xl bg-surface-50"
              >
                <div class="grid grid-cols-12 gap-3 items-center">
                  <!-- Tipo -->
                  <div class="col-span-3">
                    <p-select
                      [options]="relationTypes"
                      formControlName="type"
                      placeholder="Tipo"
                      class="w-full"
                      appendTo="body"
                    ></p-select>
                  </div>

                  <!-- Documento -->
                  <div class="col-span-8">
                    <autocomplete [items]="[]" />
                    <!-- <p-autoComplete
                      formControlName="targetDocumentId"
                      [suggestions]="filteredDocuments[i]"
                      (completeMethod)="searchDocuments($event, i)"
                      field="title"
                      [dropdown]="true"
                      placeholder="Buscar documento..."
                      class="w-full"
                    ></p-autoComplete> -->
                  </div>

                  <!-- Botón eliminar -->
                  <div class="col-span-1 text-right">
                    <button
                      pButton
                      type="button"
                      icon="pi pi-trash"
                      class="p-button-danger p-button-text"
                      (click)="removeRelation(i)"
                    ></button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="flex pt-6 justify-between">
            <p-button
              label="Atras"
              severity="secondary"
              icon="pi pi-arrow-left"
              (onClick)="activateCallback(1)"
              [outlined]="true"
              size="small"
            />
          </div>
        </ng-template>
        <p-step-panel [value]="3">
          <ng-template #content let-activateCallback="activateCallback"> </ng-template>
        </p-step-panel>
      </p-step-panel>
    </p-step-panels>
  </p-stepper>

  <div class="p-dialog-footer">
    <p-button label="Cancelar" severity="secondary" (onClick)="close()" />
    <p-button type="submit" label="Guardar" />
  </div>
</form>
