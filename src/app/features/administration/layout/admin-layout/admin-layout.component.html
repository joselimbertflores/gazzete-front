<div class="flex h-dvh overflow-hidden bg-surface-100 text-surface-900">
  @if (!isMobile()) {
    <aside class="hidden w-72 shrink-0 border-r border-surface-200 bg-surface-0 shadow-sm lg:block">
      <app-admin-sidebar />
    </aside>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="z-10 flex min-h-16 shrink-0 items-center gap-3 border-b border-surface-200 bg-surface-0/95 px-3 shadow-sm backdrop-blur sm:px-5"
    >
      @if (isMobile()) {
        <p-button
          icon="pi pi-bars"
          severity="secondary"
          [rounded]="true"
          [text]="true"
          ariaLabel="Abrir menu"
          (click)="openMobileMenu()"
        />
      }

      <div class="ml-auto flex items-center gap-2">
        <profile-overlay />
      </div>
    </header>

    <main class="min-h-0 flex-1 overflow-y-auto p-4 sm:p-6" cdkScrollable>
      <router-outlet />
    </main>
  </div>
</div>

<p-drawer
  position="left"
  [modal]="true"
  header="Administración"
  [dismissible]="true"
  [(visible)]="mobileMenuOpen"
  styleClass="admin-mobile-drawer !w-[19rem] max-w-[88vw] bg-surface-0"
  (onHide)="closeMobileMenu()"
>
  <app-admin-sidebar (click)="closeMobileMenu()" />
</p-drawer>

<p-toast />
